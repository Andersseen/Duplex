name: CI

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job only reads the repository. Nothing in CI writes to it or to GitHub.
permissions:
  contents: read

jobs:
  js:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      # Runs the same tests as `pnpm test` and enforces the per-package coverage thresholds.
      - run: pnpm test:coverage
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: pnpm --silent coverage:summary >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            apps/*/coverage
            packages/*/coverage
          retention-days: 14
          if-no-files-found: ignore
      - run: pnpm build
      - name: Tauri capability and CSP guard
        run: pnpm check:tauri
      - name: Agentyx configuration health
        run: pnpm exec agentyx doctor

  rust:
    name: Rust (Tauri helper)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/helper/src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri-build validates frontendDist, so the helper's Angular build must exist first.
      - run: pnpm --filter @duplex/helper build
      - run: pnpm rust:fmt:check
      - run: pnpm rust:check
      - run: pnpm rust:clippy
      - run: cargo test --manifest-path apps/helper/src-tauri/Cargo.toml --locked

  rust-macos:
    name: Rust (macOS helper)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/helper/src-tauri
      - run: pnpm install --frozen-lockfile
      # tauri-build validates frontendDist, so the helper's Angular build must exist first.
      - run: pnpm --filter @duplex/helper build
      # Compiles the macOS-only Quartz/Accessibility code that the Linux job cfg's out. The tests
      # are read-only; nothing here posts input or moves the runner's mouse.
      - run: pnpm rust:check
      - run: pnpm rust:clippy
      - run: cargo test --manifest-path apps/helper/src-tauri/Cargo.toml --locked

  browser-e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      # Call, collaboration, Assist, file transfer, user journeys, responsive and axe accessibility.
      - run: pnpm e2e
      # The production build with its real security headers (CSP, Permissions-Policy, ...).
      - run: pnpm e2e:production
      - name: Upload Playwright traces
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results
          retention-days: 7
          if-no-files-found: ignore

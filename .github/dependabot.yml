version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      angular:
        patterns: ['@angular/*', '@analogjs/*', 'angular-eslint']
      testing:
        patterns: ['vitest', '@vitest/*', '@testing-library/*', '@playwright/test', '@axe-core/*']
      tooling:
        patterns: ['eslint', '@eslint/*', 'typescript-eslint', 'prettier', 'typescript', 'turbo']
      cloudflare:
        patterns: ['wrangler', '@cloudflare/*', 'hono']
      tauri:
        patterns: ['@tauri-apps/*']
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: cargo
    directory: /apps/helper/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      tauri:
        patterns: ['tauri*']
      rust-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: 'chore(deps)'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'chore(ci)'
